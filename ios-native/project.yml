name: CourtTally
options:
  bundleIdPrefix: com.rwrife
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CourtTally:
    type: application
    platform: iOS
    sources:
      - path: CourtTally
      - path: ../Sources/CourtTallyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rwrife.courttally
        INFOPLIST_FILE: CourtTally/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: libsqlite3.tbd
  CourtTallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CourtTallyUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rwrife.courttally.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CourtTally
schemes:
  CourtTally:
    build:
      targets:
        CourtTally: all
        CourtTallyUITests: [test]
    test:
      targets: [CourtTallyUITests]
