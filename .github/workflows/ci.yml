name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency resolution is reproducible
        run: git diff --exit-code
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run unit, widget, and host integration tests
        run: flutter test --coverage

  android-debug:
    name: Android debug APK (development only)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code
      - name: Build non-release Android artifact
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: court-tally-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release-unsigned:
    name: Android release AAB (unsigned verification only)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code
      - name: Assert signing credentials are absent
        run: test ! -e android/key.properties
      - name: Build unsigned release App Bundle
        run: flutter build appbundle --release
      - name: Verify unsigned artifact and write checksum
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          python3 -c 'import sys,zipfile; names=[name.upper() for name in zipfile.ZipFile(sys.argv[1]).namelist()]; signatures=[name for name in names if name.startswith("META-INF/") and name.endswith((".RSA", ".DSA", ".EC"))]; assert not signatures, f"unexpected signatures: {signatures}"' "$AAB"
          (cd "$(dirname "$AAB")" && sha256sum "$(basename "$AAB")" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: court-tally-android-release-unsigned
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build (non-distributable)
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Record Xcode toolchain
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code
      - name: Build for an iOS simulator without code signing
        run: flutter build ios --simulator --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: court-tally-ios-simulator-unsigned
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
