name: Native iOS CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core scoring, storage, backup, and migration tests
        run: swift test
      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Native build and UI tests
        run: |
          xcodebuild -project ios-native/CourtTally.xcodeproj -scheme CourtTally \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/native -resultBundlePath build/NativeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-verification
          path: |
            build/NativeTests.xcresult
            build/native/Build/Products/Debug-iphonesimulator/CourtTally.app
          retention-days: 14
