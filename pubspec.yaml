name: court_tally
description: "Offline-first courtside scorekeeping for casual racket sports."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.0
  flutter_riverpod: ^3.4.2
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
